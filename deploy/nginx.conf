# Serve the built frontend from /srv/campus/frontend/dist.
# Run behind an HTTPS edge proxy; replace jobs.example.com in this template.
server {
    listen 8080;
    server_name jobs.example.com;
    root /srv/campus/frontend/dist;
    index index.html;
    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # Only use 1 trusted hop when this proxy is the sole trusted hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /health { proxy_pass http://127.0.0.1:3000; }
    location = /ready { proxy_pass http://127.0.0.1:3000; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
